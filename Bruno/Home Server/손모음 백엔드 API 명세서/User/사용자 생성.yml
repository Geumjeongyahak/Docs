info:
  name: 사용자 생성
  type: http
  seq: 2
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users"
  body:
    type: json
    data: |-
      {
        "username": "user1324",
        "password": "password123!",
        "name": "홍길동",
        "email": "user@example.com",
        "phoneNumber": "010-1234-5678",
        "role": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "user1324",
            "password": "password123!",
            "name": "홍길동",
            "email": "user@example.com",
            "phoneNumber": "010-1234-5678",
            "role": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "username": "user1324",
            "name": "홍길동",
            "email": "user@example.com",
            "phoneNumber": "010-1234-5678",
            "roles": "ADMIN"
          }
