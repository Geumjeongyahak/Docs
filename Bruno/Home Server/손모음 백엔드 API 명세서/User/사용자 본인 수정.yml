info:
  name: 사용자 본인 수정
  type: http
  seq: 7
  tags:
    - User

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/me"
  body:
    type: json
    data: |-
      {
        "name": "홍길동",
        "phoneNumber": "010-9876-5432",
        "email": "example@domain.com",
        "password": "newpassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/users/me"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "name": "홍길동",
            "phoneNumber": "010-9876-5432",
            "email": "example@domain.com",
            "password": "newpassword123!"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "username": "user1324",
            "name": "홍길동",
            "email": "user@example.com",
            "phoneNumber": "010-1234-5678",
            "roles": "ADMIN"
          }
