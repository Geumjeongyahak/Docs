info:
  name: 수업 교환 요청 목록 조회
  type: http
  seq: 1
  tags:
    - LessonExchangeRequest

http:
  method: GET
  url: "{{baseUrl}}/api/v1/lesson-exchange-requests"
  params:
    - name: status
      value: PENDING
      type: query
      disabled: true
    - name: status
      value: APPROVED
      type: query
      disabled: true
    - name: status
      value: REJECTED
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/lesson-exchange-requests"
      method: GET
      params:
        - name: status
          value: PENDING
          type: query
          disabled: true
        - name: status
          value: APPROVED
          type: query
          disabled: true
        - name: status
          value: REJECTED
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          [
            {
              "id": 1,
              "lessonId": 1,
              "lessonDate": "2026-03-28",
