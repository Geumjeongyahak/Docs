info:
  name: 토큰 재발급
  type: http
  seq: 2
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refreshToken": "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
            "refreshToken": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "tokenType": "Bearer",
            "accessTokenExpiresAt": "2026-02-10T15:30:00",
            "refreshTokenExpiresAt": "2026-02-24T14:30:00"
          }
