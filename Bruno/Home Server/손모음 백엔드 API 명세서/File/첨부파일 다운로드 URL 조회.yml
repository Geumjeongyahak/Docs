info:
  name: 첨부파일 다운로드 URL 조회
  type: http
  seq: 5
  tags:
    - File

http:
  method: GET
  url: "{{baseUrl}}/api/v1/files/attachments/:fileId/download-url"
  params:
    - name: fileId
      value: ""
      type: path
      description: 다운로드 URL을 발급할 대상 파일 ID. files 테이블의 UUID 기본 키입니다.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/files/attachments/:fileId/download-url"
      method: GET
      params:
        - name: fileId
          value: ""
          type: path
          description: 다운로드 URL을 발급할 대상 파일 ID. files 테이블의 UUID 기본 키입니다.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "downloadUrl": "https://storage.googleapis.com/example-bucket/documents/attachments/example.pdf"
          }
