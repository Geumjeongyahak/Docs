info:
  name: 학생 수정
  type: http
  seq: 5
  tags:
    - Student

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/students/:studentId"
  params:
    - name: studentId
      value: ""
      type: path
      description: 학생 식별자
  body:
    type: json
    data: |-
      {
        "name": "김철수",
        "phoneNumber": "010-4321-5678",
        "description": "학생",
        "status": "ON_LEAVE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/students/:studentId"
      method: PATCH
      params:
        - name: studentId
          value: ""
          type: path
          description: 학생 식별자
      body:
        type: json
        data: |-
          {
            "name": "김철수",
            "phoneNumber": "010-4321-5678",
            "description": "학생",
            "status": "ON_LEAVE"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "name": "홍길동",
            "phoneNumber": "010-1234-5678",
            "description": "학생입니다.",
            "status": "ENROLLED"
          }
