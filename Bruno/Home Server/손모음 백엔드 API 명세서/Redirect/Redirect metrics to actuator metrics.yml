info:
  name: Redirect metrics to actuator metrics
  type: http
  seq: 1
  tags:
    - Redirect

http:
  method: GET
  url: "{{baseUrl}}/metrics"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/metrics"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: ""
