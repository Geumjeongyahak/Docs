info:
  name: 사용자 목록 조회
  type: http
  seq: 1
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users"
  params:
    - name: page
      value: ""
      type: query
      description: 페이지 번호
      disabled: true
    - name: size
      value: ""
      type: query
      description: 페이지 크기
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/users"
      method: GET
      params:
        - name: page
          value: ""
          type: query
          description: 페이지 번호
          disabled: true
        - name: size
          value: ""
          type: query
          description: 페이지 크기
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "content": [
              {
                "id": 1,
                "username": "user1324",
                "name": "홍길동",
                "email": "user@example.com",
                "phoneNumber": "010-1234-5678",
                "roles": "ADMIN"
              }
            ],
            "page": 0,
            "size": 10,
            "totalElements": 100,
            "totalPages": 10
          }
