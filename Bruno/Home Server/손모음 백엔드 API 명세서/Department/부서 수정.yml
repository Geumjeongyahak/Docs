info:
  name: 부서 수정
  type: http
  seq: 2
  tags:
    - Department

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/departments/:id"
  params:
    - name: id
      value: ""
      type: path
      description: 부서 ID
  body:
    type: json
    data: |-
      {
        "name": "개발팀",
        "description": "소프트웨어 개발을 담당하는 팀"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/departments/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
          description: 부서 ID
      body:
        type: json
        data: |-
          {
            "name": "개발팀",
            "description": "소프트웨어 개발을 담당하는 팀"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "name": "개발팀",
            "description": "소프트웨어 개발을 담당하는 팀"
          }
