info:
  name: 수업 노트 업데이트
  type: http
  seq: 2
  tags:
    - Lesson

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/lessons/:lessonId/note"
  params:
    - name: lessonId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "note": "오늘 진도: ~ / 특이사항: ~"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/lessons/:lessonId/note"
      method: PUT
      params:
        - name: lessonId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "note": "오늘 진도: ~ / 특이사항: ~"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "lessonId": 1,
            "note": ""
          }
