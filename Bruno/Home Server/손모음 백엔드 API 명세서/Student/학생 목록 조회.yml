info:
  name: 학생 목록 조회
  type: http
  seq: 1
  tags:
    - Student

http:
  method: GET
  url: "{{baseUrl}}/api/v1/students"
  params:
    - name: name
      value: ""
      type: query
      description: 이름 검색(부분 일치)
      disabled: true
    - name: status
      value: ENROLLED
      type: query
      description: 학생 상태
      disabled: true
    - name: status
      value: ON_LEAVE
      type: query
      description: 학생 상태
      disabled: true
    - name: status
      value: COMPLETED
      type: query
      description: 학생 상태
      disabled: true
    - name: page
      value: ""
      type: query
      description: 페이지 번호
      disabled: true
    - name: size
      value: ""
      type: query
      description: 페이지 크기
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/students"
      method: GET
      params:
        - name: name
          value: ""
          type: query
          description: 이름 검색(부분 일치)
          disabled: true
        - name: status
          value: ENROLLED
          type: query
          description: 학생 상태
          disabled: true
        - name: status
          value: ON_LEAVE
          type: query
          description: 학생 상태
          disabled: true
        - name: status
          value: COMPLETED
          type: query
          description: 학생 상태
          disabled: true
        - name: page
          value: ""
          type: query
          description: 페이지 번호
          disabled: true
        - name: size
          value: ""
          type: query
          description: 페이지 크기
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "content": [
              {
                "id": 1,
                "name": "홍길동",
                "phoneNumber": "010-1234-5678",
                "description": "학생입니다.",
                "status": "ENROLLED"
              }
            ],
            "page": 0,
            "size": 10,
            "totalElements": 100,
            "totalPages": 10
          }
