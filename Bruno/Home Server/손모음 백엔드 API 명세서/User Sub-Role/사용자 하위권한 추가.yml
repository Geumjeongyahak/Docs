info:
  name: 사용자 하위권한 추가
  type: http
  seq: 2
  tags:
    - User Sub-Role

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/:userId/roles"
  params:
    - name: userId
      value: ""
      type: path
      description: 사용자 ID
  body:
    type: json
    data: |-
      {
        "subRole": "TEACHER"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/users/:userId/roles"
      method: POST
      params:
        - name: userId
          value: ""
          type: path
          description: 사용자 ID
      body:
        type: json
        data: |-
          {
            "subRole": "TEACHER"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          [
            {
              "name": "ADMIN",
              "level": 100,
              "code": 1
            }
          ]
