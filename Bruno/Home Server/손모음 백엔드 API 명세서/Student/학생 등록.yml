info:
  name: 학생 등록
  type: http
  seq: 2
  tags:
    - Student

http:
  method: POST
  url: "{{baseUrl}}/api/v1/students"
  body:
    type: json
    data: |-
      {
        "name": "홍길동",
        "phoneNumber": "010-1234-5678",
        "description": "학생입니다."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/students"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "홍길동",
            "phoneNumber": "010-1234-5678",
            "description": "학생입니다."
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "name": "홍길동",
            "phoneNumber": "010-1234-5678",
            "description": "학생입니다.",
            "status": "ENROLLED"
          }
