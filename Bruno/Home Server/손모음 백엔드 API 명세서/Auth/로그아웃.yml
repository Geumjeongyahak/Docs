info:
  name: 로그아웃
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/logout"
  body:
    type: json
    data: |-
      {
        "refreshToken": "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/logout"
      method: POST
      body:
        type: json
        data: |-
          {
            "refreshToken": "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "로그아웃되었습니다."
          }
