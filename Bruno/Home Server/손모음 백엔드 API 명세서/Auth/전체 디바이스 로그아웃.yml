  type: http
  seq: 4
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/logout-all"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/logout-all"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "로그아웃되었습니다."
          }
