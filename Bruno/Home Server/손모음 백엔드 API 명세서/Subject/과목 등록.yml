info:
  name: 과목 등록
  type: http
  seq: 2
  tags:
    - Subject

http:
  method: POST
  url: "{{baseUrl}}/api/v1/subjects"
  body:
    type: json
    data: |-
      {
        "classroomId": 1,
        "teacherId": 2,
        "name": "국어",
        "startAt": "2026-06-01",
        "endAt": "2026-08-30",
        "times": 12,
        "dayOfWeek": "MONDAY",
        "startTime": "19:20:00",
        "endTime": "20:00:00",
        "period": 1,
        "description": "과목 설명"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/subjects"
      method: POST
      body:
        type: json
        data: |-
          {
            "classroomId": 1,
            "teacherId": 2,
            "name": "국어",
            "startAt": "2026-06-01",
            "endAt": "2026-08-30",
            "times": 12,
            "dayOfWeek": "MONDAY",
            "startTime": "19:20:00",
            "endTime": "20:00:00",
            "period": 1,
            "description": "과목 설명"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "classroomId": 1,
            "teacherId": 1,
            "name": "국어",
            "startAt": "2026-02-01",
            "endAt": "2026-02-28",
            "times": 12,
            "dayOfWeek": "MONDAY",
            "startTime": "18:00",
            "endTime": "20:00",
            "period": 1,
            "description": "과목 설명",
            "isActive": true
          }
